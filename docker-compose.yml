services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tanglefix
      POSTGRES_USER: tanglefix
      POSTGRES_PASSWORD: tanglefix_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tanglefix -d tanglefix"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://tanglefix:tanglefix_dev_password@db:5432/tanglefix
      SECRET_KEY: change-this-development-secret-before-deployment
      ACCESS_TOKEN_MINUTES: "1440"
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
